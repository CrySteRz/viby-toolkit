name: release

# Bumping the version in plugin.json and pushing it is the release. This builds `viby` for every
# target the launcher knows, commits the SHA-256 of each asset to launcher/checksums.txt, tags
# that commit v<version> and publishes the assets under it. The launcher trusts checksums.txt in
# the plugin, not anything in the release, so the sums must be in the tagged commit.
#
# It runs on a push (from any branch) rather than only on workflow_dispatch, because GitHub only
# dispatches workflows that are already on the default branch. A version that is already tagged
# is skipped, so a re-push or an unrelated edit to plugin.json releases nothing.
on:
  push:
    paths: [plugins/viby-toolkit/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(jq -r .version plugins/viby-toolkit/.claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The same gate as check.yml: nothing is published that fails it.
  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - run: cargo xtask check
        working-directory: plugins/viby-toolkit/rust

  # One job per target the launcher's target() maps to. Everything is pure Rust, so the musl
  # targets need no C toolchain beyond the runner's own linker.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: plugins/viby-toolkit/rust
        run: cargo build --release --locked -p viby --target ${{ matrix.target }}
      # The launcher unpacks exactly `viby` (`viby.exe` on Windows) from viby-<target>.tar.gz.
      - name: Package
        run: |
          case "${{ matrix.target }}" in *windows*) name=viby.exe ;; *) name=viby ;; esac
          dir=plugins/viby-toolkit/rust/target/${{ matrix.target }}/release
          tar -czf "viby-${{ matrix.target }}.tar.gz" -C "$dir" "$name"
          tar -tzf "viby-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: viby-${{ matrix.target }}
          path: viby-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write launcher/checksums.txt
        run: |
          set -- dist/*.tar.gz
          test $# -eq 5
          (cd dist && sha256sum -- *.tar.gz) > plugins/viby-toolkit/launcher/checksums.txt
          cat plugins/viby-toolkit/launcher/checksums.txt
      # The tag goes on the commit that carries the sums. Pushing with the workflow's token does
      # not start another workflow run.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/viby-toolkit/launcher/checksums.txt
          git commit -m "release v$VERSION: checksums for the viby binaries"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - name: Publish the release
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/*.tar.gz "${prerelease[@]}" --verify-tag \
            --title "v$VERSION" --notes "Binaries for the viby launcher. Each asset's SHA-256 is in plugins/viby-toolkit/launcher/checksums.txt at this tag."
