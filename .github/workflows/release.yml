name: release

# Bumping the version in plugin.json and pushing it is the release. This builds `viby` for every
# target the launcher knows, commits the SHA-256 of each asset to launcher/checksums.txt, tags
# that commit v<version> and publishes the assets under it. The launcher trusts checksums.txt in
# the plugin, not anything in the release, so the sums must be in the tagged commit.
#
# It runs on a push rather than only on workflow_dispatch, because GitHub only dispatches
# workflows that are already on the default branch. A version that is already tagged is skipped,
# so a re-push or an unrelated edit to plugin.json releases nothing.
#
# Bump on a branch, never on main. Machines update from main, and until the checksums commit
# lands, a new version there carries the previous version's sums: every launcher refuses the
# download (seen with 3.0.0, for about five minutes). So a bump pushed to main fails here, and
# once a final version's binaries have passed launcher.yml, `land` fast-forwards main to the
# tagged commit. Prereleases stay on their branch.
on:
  push:
    paths: [plugins/viby-toolkit/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(jq -r .version plugins/viby-toolkit/.claude-plugin/plugin.json)
          if [ "$GITHUB_REF_NAME" = main ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version was pushed to main before its release. Bump the version on a branch; main gets it from the release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The same gate as check.yml: nothing is published that fails it.
  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - run: cargo xtask check
        working-directory: plugins/viby-toolkit/rust

  # One job per target the launcher's target() maps to. Everything is pure Rust, so the musl
  # targets need no C toolchain beyond the runner's own linker.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: plugins/viby-toolkit/rust
        run: cargo build --release --locked -p viby --target ${{ matrix.target }}
      # The launcher unpacks exactly `viby` (`viby.exe` on Windows) from viby-<target>.tar.gz.
      - name: Package
        run: |
          case "${{ matrix.target }}" in *windows*) name=viby.exe ;; *) name=viby ;; esac
          dir=plugins/viby-toolkit/rust/target/${{ matrix.target }}/release
          tar -czf "viby-${{ matrix.target }}.tar.gz" -C "$dir" "$name"
          tar -tzf "viby-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: viby-${{ matrix.target }}
          path: viby-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write launcher/checksums.txt
        run: |
          set -- dist/*.tar.gz
          test $# -eq 5
          (cd dist && sha256sum -- *.tar.gz) > plugins/viby-toolkit/launcher/checksums.txt
          cat plugins/viby-toolkit/launcher/checksums.txt
      # The tag goes on the commit that carries the sums. Pushing with the workflow's token does
      # not start another workflow run.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/viby-toolkit/launcher/checksums.txt
          git commit -m "release v$VERSION: checksums for the viby binaries"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      # For machines with no network: the tagged source with every binary in launcher/dist/, where
      # the launcher looks before downloading. install.sh in it installs the plugin.
      - name: Offline bundle
        run: |
          mkdir bundle
          git archive --format=tar --prefix=viby-toolkit/ "v$VERSION" | tar -x -C bundle
          mkdir -p bundle/viby-toolkit/plugins/viby-toolkit/launcher/dist
          cp dist/*.tar.gz bundle/viby-toolkit/plugins/viby-toolkit/launcher/dist/
          tar -czf "viby-toolkit-$VERSION-offline.tar.gz" -C bundle viby-toolkit
          tar -tzf "viby-toolkit-$VERSION-offline.tar.gz" | grep launcher/
      - name: Publish the release
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/*.tar.gz "viby-toolkit-$VERSION-offline.tar.gz" "${prerelease[@]}" --verify-tag \
            --title "v$VERSION" --notes "Binaries for the viby launcher. Each binary's SHA-256 is in plugins/viby-toolkit/launcher/checksums.txt at this tag. For a machine with no network, copy viby-toolkit-$VERSION-offline.tar.gz over, extract it and run bash viby-toolkit/install.sh."

  # The published binaries on a fresh machine of every OS, through the launcher.
  launcher:
    needs: [plan, publish]
    uses: ./.github/workflows/launcher.yml
    with:
      ref: v${{ needs.plan.outputs.version }}

  # A final version reaches main only now: published, and run on a fresh machine of every OS.
  land:
    needs: [plan, launcher]
    if: ${{ !contains(needs.plan.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0
      # Fast-forward only: a main that moved on meanwhile is refused, and that is merged by hand.
      - run: git push origin HEAD:refs/heads/main
