name: check

# The other machines auto-update from this repo's default branch, so a broken push
# propagates. This runs the same gate as `cargo xtask check` locally, on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version check compares plugin.json with the newest tag,
      # and a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same version as rust-toolchain.toml, so CI cannot drift from local builds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # Every suite with its minimum pass count, clippy, the scanner on its own tests,
      # versions, cross-references and the SessionStart JSON. The plugin manifests are
      # validated by the Claude Code CLI, which isn't installed here, so that one check
      # reports as skipped.
      - run: cargo xtask check
