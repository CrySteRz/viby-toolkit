name: launcher

# A machine that has never run viby, on each OS a release targets, runs the launcher the way
# Claude Code does: .github/launcher-fresh.sh (hook, MCP spawn without a shell, download and
# verify, a tampered asset, the cargo fallback, no cargo). release.yml calls this once a release
# is published. A push that changes this file or the script runs it against plugin.json's
# version, whose release must already exist.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to test (it carries launcher/checksums.txt for its release).
        type: string
        required: true
  push:
    paths: [.github/workflows/launcher.yml, .github/launcher-fresh.sh]

permissions:
  contents: read

jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Claude Code's native build is Bun; both runtimes must start launcher/viby without a shell.
      - uses: oven-sh/setup-bun@v2
      - run: bash .github/launcher-fresh.sh
